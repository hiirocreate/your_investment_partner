name: Build APK

on:
  push:
    branches-ignore: ["ci-status"]
  pull_request:
    branches-ignore: ["ci-status"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: unit_tests
        run: set -o pipefail; ./gradlew test --stacktrace 2>&1 | tee build_test.log

      - name: Build debug APK
        id: build_debug
        run: set -o pipefail; ./gradlew assembleDebug --stacktrace 2>&1 | tee build_debug.log

      - name: Decode release keystore (skipped if signing secrets aren't configured yet)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            mkdir -p app/keystore
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore.jks
            # Use an ABSOLUTE path here. build.gradle.kts calls file(RELEASE_STORE_FILE) from
            # inside the app/ module script, so a relative "app/keystore/..." gets resolved
            # *again* relative to app/, landing on app/app/keystore/... (confirmed: that's
            # exactly the doubled path GitHub Actions run #27 failed on). An absolute path
            # sidesteps that ambiguity entirely.
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/app/keystore/release.keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (unsigned unless signing secrets are configured)
        id: build_release
        run: set -o pipefail; ./gradlew assembleRelease --stacktrace 2>&1 | tee build_release.log
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Show release APK output directory
        if: always()
        run: |
          echo "RELEASE_STORE_FILE was set: $([ -n "$RELEASE_STORE_FILE" ] && echo yes || echo no)"
          ls -la app/build/outputs/apk/release/ 2>&1 || echo "(release output directory does not exist - the build did not get this far)"

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish CI status
        if: always()
        run: |
          set +e
          STATUS="success"
          if [ "${{ steps.build_debug.outcome }}" != "success" ] || [ "${{ steps.build_release.outcome }}" != "success" ] || [ "${{ steps.unit_tests.outcome }}" != "success" ]; then
            STATUS="failure"
          fi

          mkdir -p /tmp/ci-status
          {
            echo "# CI Status"
            echo ""
            echo "status: $STATUS"
            echo "run_id: ${{ github.run_id }}"
            echo "run_number: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "ref: ${{ github.ref }}"
            echo "workflow_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "timestamp_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "unit_tests: ${{ steps.unit_tests.outcome }}"
            echo "build_debug: ${{ steps.build_debug.outcome }}"
            echo "build_release: ${{ steps.build_release.outcome }}"
            echo ""
            echo "## Last log lines (debug build)"
            echo '```'
            tail -n 80 build_debug.log 2>/dev/null
            echo '```'
            echo ""
            echo "## Last log lines (release build)"
            echo '```'
            tail -n 80 build_release.log 2>/dev/null
            echo '```'
            echo ""
            echo "## Release build failure summary (if any)"
            echo '```'
            awk '/FAILURE: Build failed|^\* What went wrong:/{found=1} found' build_release.log 2>/dev/null | head -n 100
            echo '```'
          } > /tmp/ci-status/last-build.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin ci-status:ci-status 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/ci-status; then
            git checkout ci-status
          else
            git checkout --orphan ci-status
            git rm -rf . > /dev/null 2>&1 || true
          fi

          cp /tmp/ci-status/last-build.md ./last-build.md
          git add last-build.md
          git commit -m "ci: build $STATUS for ${{ github.sha }}" || echo "nothing to commit"
          git push origin ci-status --force
