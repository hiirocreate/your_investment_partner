name: Fetch Market Data

# Powers "see every company whose stock can be purchased" in the web app: fetches the full
# TSE-listed company master (~4,000 companies) and a same-day price snapshot for all of them,
# using J-Quants (JPX's free API), and commits the result to same-origin static JSON files that
# the app reads (docs/data/companies.json, docs/data/quotes.json).
#
# Why this has to run here instead of in the visitor's own browser: J-Quants does not send CORS
# headers, so a browser calling it directly from a page hosted on a different origin is always
# blocked (confirmed by live testing - not guessed). There is no client-side workaround. This
# also means the API key has to live as a GitHub Secret (JQUANTS_API_KEY) rather than only in
# each visitor's own browser storage - see the app's Settings screen for the up to date
# explanation shown to users.
#
# Free-plan reality check (also shown honestly in the app, never disguised as "live"): J-Quants'
# free plan only allows price data from 12 weeks ago and earlier, and rate-limits to 5 requests
# per minute. So "asOfDate" below is always roughly 3 months old, and this workflow paces its
# requests accordingly. If JQUANTS_API_KEY isn't set yet, this workflow does nothing and leaves
# the existing (seed) data files untouched, so the app keeps working with sample data in the
# meantime - same graceful-skip pattern as the release keystore step in build-apk.yml.

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST (無料プランはどのみち約12週間遅延データなので高頻度更新は不要)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch company master + price snapshot from J-Quants
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          set -e
          mkdir -p docs/data
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          API_KEY = os.environ.get("JQUANTS_API_KEY", "")
          if not API_KEY:
              print("JQUANTS_API_KEY is not set yet - skipping market data fetch. "
                    "docs/data/companies.json and docs/data/quotes.json are left as-is, so the "
                    "app keeps showing its seeded/sample data until the secret is added.")
              raise SystemExit(0)

          BASE = "https://api.jquants.com/v2"
          REQUEST_INTERVAL_SEC = 13  # Free plan: 5 requests/minute -> stay safely under that.

          def call(path, params):
              qs = urllib.parse.urlencode({k: v for k, v in params.items() if v is not None})
              url = f"{BASE}{path}?{qs}" if qs else f"{BASE}{path}"
              req = urllib.request.Request(url, headers={"x-api-key": API_KEY})
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.loads(res.read().decode("utf-8"))

          def fetch_all(path, params):
              items = []
              page_params = dict(params)
              first = True
              while True:
                  if not first:
                      time.sleep(REQUEST_INTERVAL_SEC)
                  first = False
                  body = call(path, page_params)
                  items.extend(body.get("data", []))
                  pagination_key = body.get("pagination_key")
                  if not pagination_key:
                      break
                  page_params = dict(params)
                  page_params["pagination_key"] = pagination_key
              return items

          def normalize_code(raw):
              raw = str(raw or "")
              return raw[:4] if len(raw) >= 4 else raw

          def market_label(mkt_nm):
              return mkt_nm or "不明"

          now_ms = int(time.time() * 1000)

          # --- 1) 上場銘柄一覧 (company master) -------------------------------------------------
          # Reference data, not price data - not subject to the 12-week price embargo, so no date
          # is passed: this returns the current listing.
          try:
              master_rows = fetch_all("/equities/master", {})
          except Exception as e:
              print(f"WARN: company master fetch failed: {e}")
              master_rows = None

          if master_rows is not None:
              by_code = {}
              for row in master_rows:
                  code = normalize_code(row.get("Code"))
                  if not code:
                      continue
                  by_code[code] = {
                      "code": code,
                      "name": row.get("CoName") or code,
                      "nameEn": row.get("CoNameEn") or None,
                      "market": market_label(row.get("MktNm")),
                      "sector33": row.get("S33Nm") or None,
                  }
              companies_out = {
                  "fetchedAtEpochMillis": now_ms,
                  "companies": sorted(by_code.values(), key=lambda c: c["code"]),
              }
              with open("docs/data/companies.json", "w", encoding="utf-8") as f:
                  json.dump(companies_out, f, ensure_ascii=False)
              print(f"Wrote docs/data/companies.json: {len(companies_out['companies'])} companies")
          else:
              print("Skipping docs/data/companies.json write (fetch failed) - keeping previous file")

          # --- 2) 株価四本値スナップショット (all-companies, one date) ---------------------------
          # Free plan only serves data from 12 weeks ago and earlier. Walk backward from that
          # cutoff (and again from the day before) until each lands on an actual trading day, so
          # we get a same-day price plus a previous-close to compute a real change%.
          def find_trading_day_rows(start_date, max_back_days=10):
              d = start_date
              for _ in range(max_back_days):
                  date_str = d.strftime("%Y-%m-%d")
                  try:
                      rows = fetch_all("/equities/bars/daily", {"date": date_str})
                  except Exception as e:
                      print(f"WARN: bars/daily fetch failed for {date_str}: {e}")
                      rows = []
                  if rows:
                      return date_str, rows
                  time.sleep(REQUEST_INTERVAL_SEC)
                  d -= timedelta(days=1)
              return None, []

          cutoff = datetime.now(timezone.utc) - timedelta(days=90)  # 12週間(84日)より少し余裕を見た
          asof_date, asof_rows = find_trading_day_rows(cutoff)
          prev_date, prev_rows = (None, [])
          if asof_date:
              prev_start = datetime.strptime(asof_date, "%Y-%m-%d") - timedelta(days=1)
              prev_date, prev_rows = find_trading_day_rows(prev_start)

          if asof_date:
              prev_close_by_code = {}
              for row in prev_rows:
                  code = normalize_code(row.get("Code"))
                  close = row.get("AdjC", row.get("C"))
                  if code and close is not None:
                      prev_close_by_code[code] = close

              quotes = {}
              for row in asof_rows:
                  code = normalize_code(row.get("Code"))
                  if not code:
                      continue
                  o, h, l, c = row.get("AdjO", row.get("O")), row.get("AdjH", row.get("H")), row.get("AdjL", row.get("L")), row.get("AdjC", row.get("C"))
                  if c is None:
                      continue
                  quotes[code] = {
                      "date": asof_date,
                      "open": o, "high": h, "low": l, "close": c,
                      "volume": row.get("AdjVo", row.get("Vo")),
                      "prevClose": prev_close_by_code.get(code),
                      "prevDate": prev_date,
                  }
              quotes_out = {"fetchedAtEpochMillis": now_ms, "asOfDate": asof_date, "quotes": quotes}
              with open("docs/data/quotes.json", "w", encoding="utf-8") as f:
                  json.dump(quotes_out, f, ensure_ascii=False)
              print(f"Wrote docs/data/quotes.json: {len(quotes)} quotes, asOfDate={asof_date}")
          else:
              print("WARN: could not find any trading day with data in the allowed range - "
                    "keeping previous docs/data/quotes.json")
          PY

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/companies.json docs/data/quotes.json
          if git diff --cached --quiet; then
            echo "No market data changes"
            exit 0
          fi
          git commit -m "chore: refresh market data (companies + quotes) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
