name: Fetch News Data

# The web app (docs/) cannot call the TDnet news API directly from the browser - that API
# doesn't send CORS headers, so browsers block the request no matter what the app does. The
# fix has to happen server-side: this workflow runs on a GitHub-hosted runner (no CORS there),
# fetches the same data TDnet would have served the browser, and commits it to a same-origin
# static file (docs/data/news.json) that the app fetches instead. That makes news a periodic
# snapshot rather than literally live - the app shows "fetched at" from this file's own
# timestamp so that's never disguised as real-time (spec section 40).

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch TDnet news
        run: |
          set -e
          mkdir -p docs/data
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          BASE = "https://webapi.yanoshin.jp/webapi/tdnet/list"
          # Stock codes for the companies built into the app (SAMPLE_COMPANIES in app.js).
          # "9999" (the fictional IPO sample company) is skipped since it has no real TDnet data.
          COMPANY_CODES = ["7203", "7267", "9984", "6758", "9432", "8306", "6501", "4661", "9983", "4755"]

          def fetch(condition, limit):
              url = f"{BASE}/{condition}.json?limit={limit}"
              req = urllib.request.Request(url, headers={"User-Agent": "investment-monitor-web/1.0"})
              with urllib.request.urlopen(req, timeout=20) as res:
                  body = json.loads(res.read().decode("utf-8"))
              return body.get("items", [])

          data = {"fetchedAtEpochMillis": int(time.time() * 1000), "recent": [], "byCompany": {}}

          try:
              # 150, not 50: the app's news tab requests up to 100 items from this list, and the
              # "recent" feed spans all ~4,000 TSE-listed companies (not just the 10 tracked ones),
              # so a shallow fetch would mostly miss the tracked companies' own news entirely.
              data["recent"] = fetch("recent", 150)
          except Exception as e:
              print(f"WARN: recent news fetch failed: {e}")

          for code in COMPANY_CODES:
              try:
                  data["byCompany"][code] = fetch(code, 20)
              except Exception as e:
                  print(f"WARN: news fetch for {code} failed: {e}")
              time.sleep(0.5)

          with open("docs/data/news.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"Wrote docs/data/news.json: {len(data['recent'])} recent items, "
                f"{sum(len(v) for v in data['byCompany'].values())} per-company items")
          PY

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi
          git commit -m "chore: refresh news data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
