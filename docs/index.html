<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>投資情報モニター</title>

<!-- iPhoneのホーム画面に追加したとき、アプリのように見せるための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="投資モニター">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2A4A">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <header id="topbar" class="topbar">
    <button id="topbarBack" class="topbar-icon-btn" hidden aria-label="戻る">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="topbarTitle">投資情報モニター</h1>
    <button id="topbarSearch" class="topbar-icon-btn" aria-label="企業を検索">
      <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="screen" class="screen"></main>

  <button id="fab" class="fab" hidden aria-label="企業を追加">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <nav id="tabbar" class="tabbar">
    <button class="tab-btn" data-route="home">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 11.5L12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>ホーム</span>
    </button>
    <button class="tab-btn" data-route="watchlist">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 20.5s-7.5-4.6-9.9-9.1C.6 8 2 4.7 5.3 4.1c2-.35 3.9.55 4.9 2.15C11.2 4.65 13.1 3.75 15.1 4.1c3.3.6 4.7 3.9 3.2 7.3-2.4 4.5-6.3 9.1-6.3 9.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>監視企業</span>
    </button>
    <button class="tab-btn" data-route="trending">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 17l6-6 4 4 8-9M21 6h-5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>注目企業</span>
    </button>
    <button class="tab-btn" data-route="news">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 8.5h10M7 12h10M7 15.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>ニュース</span>
    </button>
    <button class="tab-btn" data-route="settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.4-2-3.5-2.3.7a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.5 2.3a7.6 7.6 0 0 0-2.6 1.5l-2.3-.7-2 3.5 2 1.4a7.6 7.6 0 0 0 0 3l-2 1.4 2 3.5 2.3-.7a7.6 7.6 0 0 0 2.6 1.5L10 22h4l.5-2.3a7.6 7.6 0 0 0 2.6-1.5l2.3.7 2-3.5-2-1.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span>設定</span>
    </button>
  </nav>
</div>

<template id="toastTemplate"><div class="toast"></div></template>

<script type="module" src="app.js"></script>
</body>
</html>
